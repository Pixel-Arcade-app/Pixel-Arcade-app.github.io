<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Pixel Arcade — réinitialisation</title><style>body{font-family:system-ui;text-align:center;padding:40px;background:#070a12;color:#fff}p{color:#aeb8d1}</style><h1>Pixel Arcade</h1><p>Nettoyage de l'ancienne version…</p><script>async function reset(){try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}}finally{location.replace('./index.html?clean='+Date.now())}}reset();</script>
