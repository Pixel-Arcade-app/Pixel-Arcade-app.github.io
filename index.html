<head>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%23070a12%27/%3E%3Crect x=%2718%27 y=%2720%27 width=%2764%27 height=%2760%27 rx=%2712%27 fill=%27%237280ff%27/%3E%3Cpath d=%27M30 64h10V42h10v12h10V34h10v30h10%27 fill=%27none%27 stroke=%27white%27 stroke-width=%276%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<style>
:root{--bg:#070a12;--p:#11172a;--p2:#171f36;--line:#2c3756;--txt:#f7f8ff;--muted:#9ba6c1;--a:#7280ff;--good:#51df92;--bad:#ff637d;--game:#05070d;--card:#0b1020}
:root.light{--bg:#f3f5f8;--p:#ffffff;--p2:#eef1f5;--line:#cbd2dc;--txt:#1d2430;--muted:#667085;--a:#3f5bd8;--good:#198754;--bad:#d6455d;--game:#e8ecf2;--card:#ffffff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#2a255f 0,var(--bg) 38%);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.light body{background:var(--bg)}button{font:inherit}
header{padding:32px 6vw 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:end;gap:20px}h1{margin:0;font-size:clamp(42px,7vw,76px);line-height:.85}.ey{color:#aab1ff;font-weight:900;letter-spacing:.2em;margin:0 0 9px}.sub{color:var(--muted);margin:10px 0 0}.status{border:1px solid var(--line);border-radius:99px;padding:9px 14px;white-space:nowrap}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#ffbd55;margin-right:8px}
main{max-width:1350px;margin:auto;padding:24px 18px 70px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.filter,.back,.small{background:var(--p);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 13px;cursor:pointer}.filter.active,.primary{background:var(--a);border-color:var(--a)}.primary{color:white;border:0;border-radius:10px;padding:9px 15px;font-weight:800;cursor:pointer}
.games{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:linear-gradient(145deg,var(--p),#0b1020);border:1px solid var(--line);border-radius:18px;color:#fff;padding:18px;text-align:left;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-4px);border-color:#7885ff}.icon{font-size:15px;font-weight:900;letter-spacing:.08em;color:var(--a);margin-bottom:8px}.tag{font-size:10px;color:#aeb8d1;letter-spacing:.13em;text-transform:uppercase}.card h2{font-size:19px;margin:7px 0 5px}.card p{font-size:13px;color:var(--muted);min-height:38px;margin:0}.card b{display:block;color:#919cff;margin-top:13px}
.panel{margin-top:24px;background:#0c1120;border:1px solid var(--line);border-radius:22px;padding:20px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}.bar h2{margin:0}.game{margin-top:14px;min-height:510px;background:var(--game);border-radius:15px;display:grid;place-items:center;position:relative;overflow:hidden}.hud{position:absolute;z-index:5;top:12px;left:15px;right:15px;display:flex;justify-content:space-between;font-size:14px;font-weight:800}canvas{max-width:100%;height:auto;touch-action:none}.muted{color:var(--muted)}.error{color:var(--bad)}.ok{color:var(--good)}
.memory{display:grid;grid-template-columns:repeat(4,78px);gap:10px}.tile{width:78px;height:78px;border:0;border-radius:12px;background:#1a2442;color:transparent;cursor:pointer;font-size:29px}.tile.open,.tile.matched{background:#6572ff;color:#fff}.center{width:min(760px,94%)}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{padding:13px;background:var(--p2);color:white;border:1px solid var(--line);border-radius:11px;cursor:pointer;text-align:left}.question{font-size:24px;font-weight:850;margin-bottom:16px}.versus{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.scorebox{min-width:160px;text-align:center;background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:15px}.big{font-size:40px;font-weight:900}.row{display:flex;justify-content:space-between;padding:10px 12px;margin:6px 0;border-radius:9px;background:#151b2d}.finish{width:min(520px,94%);background:#10172a;border:1px solid var(--line);border-radius:20px;padding:28px;text-align:center}.finish h2{margin-top:0}.leaderboard{width:min(760px,96%);margin:22px auto 0;background:#0b1020;border:1px solid var(--line);border-radius:18px;padding:16px}.leaderboard h3{margin:0 0 10px}.leader-row{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:10px;padding:10px 12px;margin:6px 0;border-radius:10px;background:#151b2d}.leader-rank{font-weight:950;font-size:18px}.leader-pseudo{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.leader-score{font-weight:950}.leader-empty{padding:12px;color:var(--muted)}.pseudo{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#080d19;color:#fff;font-size:17px;margin:12px 0}.desc{width:min(900px,94%);margin:0 auto 12px;padding:10px 14px;background:#10172a;border:1px solid var(--line);border-radius:10px;color:#aeb8d1}.desc strong{color:#fff}
.clicker{width:min(1050px,96%);display:grid;grid-template-columns:1.35fr .9fr;gap:18px;align-items:stretch}.click-main,.click-side{background:linear-gradient(145deg,#10172b,#090d19);border:1px solid var(--line);border-radius:20px;padding:18px}.click-main{text-align:center}.click-title{font-size:clamp(25px,4vw,42px);margin:4px 0}.coins{font-size:clamp(34px,6vw,62px);font-weight:950}.persec{color:var(--muted)}.core{width:min(310px,70vw);height:min(310px,70vw);margin:20px auto;border-radius:50%;border:8px solid #7280ff;background:radial-gradient(circle,#6675ff 0,#303b91 42%,#10162e 72%);box-shadow:0 0 35px #5262ff66,inset 0 0 40px #05070d;display:grid;place-items:center;color:white;font-size:54px;font-weight:950;cursor:pointer;user-select:none;touch-action:manipulation;transition:transform .06s}.core:active{transform:scale(.94)}.click-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.upgrade{background:#151d33;border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px;text-align:left;cursor:pointer}.upgrade:hover:not(:disabled){border-color:#7280ff}.upgrade:disabled{opacity:.45;cursor:not-allowed}.upgrade strong{display:block}.upgrade small{display:block;color:var(--muted);margin-top:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{background:#0b1020;border:1px solid var(--line);border-radius:10px;padding:9px}.stat b{display:block;font-size:19px}.pop{position:fixed;pointer-events:none;font-weight:950;color:#fff;z-index:99;animation:pop .65s ease-out forwards}@keyframes pop{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.3)}}.achievement{padding:9px;border-radius:9px;background:#151d33;margin:6px 0;color:#cbd2e6}.achievement.on{border-color:#55df93;color:#55df93}
.theme-btn{background:var(--p);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 12px;cursor:pointer}.footer{max-width:1350px;margin:-35px auto 0;padding:0 18px 24px;text-align:center;color:var(--muted);font-size:12px}.light .panel,.light .leaderboard{background:#fff}.light .card,.light .click-main,.light .click-side{background:var(--p)}.light .finish,.light .desc,.light .row,.light .leader-row,.light .upgrade,.light .stat,.light .achievement{background:var(--p2)}.light .pseudo{background:#fff;color:var(--txt)}.light .game{background:var(--game)}
@media(max-width:800px){.clicker{grid-template-columns:1fr}.click-grid{grid-template-columns:1fr}}

@media(max-width:1050px){.games{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){header{display:block}.status{display:inline-block;margin-top:15px}.games{grid-template-columns:1fr}.memory{grid-template-columns:repeat(4,58px)}.tile{width:58px;height:58px}.answers{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><p class="ey">LOCAL ARCADE</p><h1>PIXEL ARCADE</h1><p class="sub">16 jeux • solo • 2 joueurs • Supabase local</p></div><div style="display:flex;gap:8px;align-items:center"><button id="themeBtn" class="theme-btn" type="button" onclick="toggleTheme()">Mode clair</button><button id="installBtn" class="theme-btn" type="button" style="display:none" onclick="installApp()">Installer</button><div class="status"><span id="dot" class="dot"></span><span id="connection">Supabase...</span></div></div></header>
<main>
<div class="toolbar" id="toolbar"><button class="filter active" onclick="filterGames('all',this)">Tous</button><button class="filter" onclick="filterGames('solo',this)">Solo</button><button class="filter" onclick="filterGames('2p',this)">2 joueurs</button><button class="filter" onclick="filterGames('quick',this)">Rapides</button></div>
<section class="games" id="games">
<button class="card" data-type="solo quick" onclick="start('runner')"><div class="icon">RUN</div><span class="tag">Solo</span><h2>Pixel Runner</h2><p>Saute les obstacles.</p><b>Jouer</b></button>
<button class="card" data-type="solo" onclick="start('memory')"><div class="icon">MEM</div><span class="tag">Solo</span><h2>Memory Grid</h2><p>Trouve les paires.</p><b>Jouer</b></button>
<button class="card" data-type="solo quick" onclick="start('meteor')"><div class="icon">MET</div><span class="tag">Solo</span><h2>Meteor Dodge</h2><p>Évite les météores.</p><b>Jouer</b></button>
<button class="card" data-type="solo quick" onclick="start('snake')"><div class="icon">SNA</div><span class="tag">Solo</span><h2>Snake</h2><p>Mange sans te mordre.</p><b>Jouer</b></button>
<button class="card" data-type="solo quick" onclick="start('breakout')"><div class="icon">BRK</div><span class="tag">Solo</span><h2>Brick Breaker</h2><p>Casse les briques.</p><b>Jouer</b></button>
<button class="card" data-type="solo quick" onclick="start('flappy')"><div class="icon">FLP</div><span class="tag">Solo</span><h2>Flappy Pixel</h2><p>Passe entre les tuyaux.</p><b>Jouer</b></button>
<button class="card" data-type="solo quick" onclick="start('reaction')"><div class="icon">REA</div><span class="tag">Solo</span><h2>Reaction Rush</h2><p>Réagis au bon moment.</p><b>Jouer</b></button>
<button class="card" data-type="solo" onclick="start('clicker')"><div class="icon">CLK</div><span class="tag">Solo • GROS JEU</span><h2>Mega Clicker</h2><p>Clique, améliore ton empire et automatise ta production.</p><b>Jouer</b></button>
<button class="card" data-type="solo" onclick="start('quiz')"><div class="icon">QUI</div><span class="tag">Solo</span><h2>Quiz Blitz</h2><p>Réponds aux questions.</p><b>Jouer</b></button>
<button class="card" data-type="2p quick" onclick="start('pong')"><div class="icon">PNG</div><span class="tag">2 joueurs</span><h2>Pong Duel</h2><p>W/S contre ↑/↓.</p><b>Jouer</b></button>
<button class="card" data-type="2p quick" onclick="start('ttt')"><div class="icon">TTT</div><span class="tag">2 joueurs</span><h2>Morpion</h2><p>Aligne trois symboles.</p><b>Jouer</b></button>
<button class="card" data-type="2p quick" onclick="start('draw')"><div class="icon">🟢</div><span class="tag">2 joueurs</span><h2>Quick Draw</h2><p>F contre J au signal.</p><b>Jouer</b></button>
<button class="card" data-type="2p quick" onclick="start('tap')"><div class="icon">TAP</div><span class="tag">2 joueurs</span><h2>Tap Battle</h2><p>F contre J.</p><b>Jouer</b></button>
<button class="card" data-type="2p" onclick="start('rps')"><div class="icon">RPS</div><span class="tag">2 joueurs</span><h2>Shifumi</h2><p>Choix simultané.</p><b>Jouer</b></button>
<button class="card" data-type="2p quick" onclick="start('lights')"><div class="icon">LGT</div><span class="tag">2 joueurs</span><h2>Light Race</h2><p>F contre J, premier à 7.</p><b>Jouer</b></button>
<button class="card" data-type="2p" onclick="start('dots')"><div class="icon">DOT</div><span class="tag">2 joueurs</span><h2>Dot Duel</h2><p>Capture les cases.</p><b>Jouer</b></button>
<button class="card" data-type="2p quick" onclick="start('math')"><div class="icon">➕</div><span class="tag">2 joueurs</span><h2>Math Duel</h2><p>Premier à 5 points.</p><b>Jouer</b></button>
</section>

<section class="panel"><div class="bar"><h2 id="title">Choisis un jeu</h2><div style="display:flex;gap:8px"><button id="replay" class="back" style="display:none" onclick="restartCurrent()">Rejouer</button><button id="back" class="back" style="display:none" onclick="home()">Retour à l'arcade</button></div></div><div id="game" class="game"><p class="muted">Tout le code est dans ce fichier.</p></div><div id="leaderboard" class="leaderboard" style="display:none"></div></section>

</main>
<footer class="footer">Par Louis BRUNEL en 2nde C, assisté par IA</footer>

<script>
/* Supabase local : aucun CDN. */
window.addEventListener("error",e=>{console.error(e.error||e.message);const g=document.getElementById("game");if(g)g.innerHTML="<div style=\"padding:30px;text-align:center\"><h2>Erreur JavaScript</h2><p class=\"error\">"+String(e.message).replace(/[&<>]/g,"")+" </p></div>"});
const SUPABASE_URL="http://127.0.0.1:54321";
const SUPABASE_ANON_KEY="REMPLACE_PAR_TA_CLE_ANON_LOCALE";
let supa=false, raf=0, timers=[];
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function clearGame(){
  gameSession++;
  cancelAnimationFrame(raf);
  timers.forEach(clearTimeout);
  timers=[];
  window.onkeydown=null;window.onkeyup=null;window.onpointerdown=null;
}
function timer(fn,ms){
  const session=gameSession;
  const id=setTimeout(()=>{
    if(session!==gameSession)return;
    fn();
  },ms);
  timers.push(id);
  return id;
}
function title(t){$("title").textContent=t}function box(s){$("game").innerHTML=s}
async function api(path,opt={}){let h={"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json",...(opt.headers||{})};let r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opt,headers:h});let txt=await r.text();if(!r.ok)throw Error(txt||r.statusText);return txt?JSON.parse(txt):null}
let finishShown=false;
let activeScore=0;
const GAME_DESC={
 runner:"Cours le plus longtemps possible et saute les obstacles sans les toucher.",
 memory:"Retourne les cartes deux par deux et retrouve toutes les paires avec le moins de coups possible.",
 meteor:"Déplace ton vaisseau et évite les météores. Plus tu tiens longtemps, plus le score monte.",
 snake:"Mange les fruits, grandis et évite les murs ainsi que ton propre corps.",
 breakout:"Utilise la raquette pour renvoyer la balle et détruire toutes les briques.",
 flappy:"Fais voler ton personnage entre les tuyaux sans les toucher et bats ton meilleur score.",
 reaction:"Teste tes réflexes : attends le signal vert puis clique le plus vite possible.",
 quiz:"Réponds à une série de questions et accumule des points pour chaque bonne réponse.",
 clicker:"Clique sur le noyau, achète des améliorations, automatise la production et construis ton empire d’énergie.",
 pong:"Duel classique à deux : J1 utilise W/S et J2 utilise les flèches. Le premier à 7 gagne.",
 ttt:"À deux, place ton symbole sur la grille et aligne trois cases avant ton adversaire.",
 draw:"Attendez le signal vert : F pour J1 et J pour J2. Le plus rapide gagne.",
 tap:"Deux joueurs poussent une barre avec leurs touches. Le premier qui atteint l’extrémité gagne.",
 rps:"Jouez plusieurs manches de pierre-papier-ciseaux et soyez le premier à gagner trois manches.",
 lights:"Une cible apparaît pour F ou J. Appuie sur la bonne touche avant l’autre joueur, jusqu’à 7 points.",
 dots:"Les joueurs capturent les 25 cases à tour de rôle. Celui qui en possède le plus gagne.",
 math:"Deux joueurs résolvent des multiplications. Le premier à 5 bonnes réponses gagne."
};
function resetActiveScore(){activeScore=0;const s=document.getElementById("s");if(s)s.textContent="Score : 0"}
function localScores(){try{return JSON.parse(localStorage.getItem("pixelArcadeScores")||"[]")}catch(e){return []}}
function saveLocalScore(game,points,players,pseudo){let a=localScores();a.unshift({game,score:Math.round(points),players,pseudo,created_at:new Date().toISOString()});a=a.slice(0,1000);try{localStorage.setItem("pixelArcadeScores",JSON.stringify(a));localStorage.setItem("pixelArcadePseudo",pseudo)}catch(e){}}
function rankIcon(i){return "Top "+(i+1)}
function renderLeaderboard(game,data){
  const el=$("leaderboard");
  const gameNames={runner:"Pixel Runner",memory:"Memory Grid",meteor:"Meteor Dodge",snake:"Snake",breakout:"Brick Breaker",flappy:"Flappy Pixel",reaction:"Reaction Rush",quiz:"Quiz Blitz",clicker:"Mega Clicker",pong:"Pong Duel",ttt:"Morpion",draw:"Quick Draw",tap:"Tap Battle",rps:"Shifumi",lights:"Light Race",dots:"Dot Duel",math:"Math Duel"};
  if(!el)return;
  const rows=(data||[]).filter(x=>String(x.game)===String(game)).sort((a,b)=>Number(b.score||0)-Number(a.score||0)).slice(0,10);
  el.style.display="block";
  el.innerHTML=`<h3>Top 10 — ${esc(gameNames[game]||game)}</h3>`+(rows.length?rows.map((x,i)=>`<div class="leader-row"><span class="leader-rank">${rankIcon(i)}</span><span class="leader-pseudo">${esc(x.pseudo||"Joueur")}</span><span class="leader-score">${Math.round(Number(x.score)||0)}</span></div>`).join(""):"<div class=leader-empty>Aucun score pour ce jeu.</div>");
}
async function loadLeaderboard(game){
  if(!game)return;
  try{
    if(supa){
      let d=await api("scores?select=game,score,players,pseudo,created_at&game=eq."+encodeURIComponent(game)+"&order=score.desc&limit=10");
      renderLeaderboard(game,d);
    }else renderLeaderboard(game,localScores());
  }catch(e){renderLeaderboard(game,localScores())}
}
async function score(game,points,players=1){
  if(finishShown)return;
  finishShown=true;
  const pts=Math.max(0,Math.round(points));
  activeScore=pts;
  clearGame();
  box(`<div class="finish"><div class="tag">PARTIE TERMINÉE</div><h2>${esc(game)}</h2><div class="big">${pts}</div><p class="muted">Score de la partie</p><input id="pseudoInput" class="pseudo" maxlength="20" autocomplete="nickname" placeholder="Ton pseudo (3 à 20 caractères)"><button class="primary" id="saveScoreBtn">Enregistrer le score</button><p id="saveMsg" class="muted">Le pseudo sera affiché dans le classement de ce jeu.</p></div>`);
  const oldPseudo=localStorage.getItem("pixelArcadePseudo")||"";$("pseudoInput").value=oldPseudo;$("pseudoInput").focus();
  $("saveScoreBtn").onclick=async()=>{
    let pseudo=$("pseudoInput").value.trim().replace(/[^a-zA-Z0-9À-ÿ _-]/g,"");
    if(pseudo.length<3)pseudo="Joueur";
    saveLocalScore(game,pts,players,pseudo);
    let savedOnline=false;
    if(supa){
      try{await api("scores",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({game,score:pts,players,pseudo})});savedOnline=true}
      catch(e){console.warn("Score Supabase avec pseudo:",e)}
    }
    await loadLeaderboard(game);
    $("saveMsg").textContent=savedOnline?"Score enregistré dans Supabase local et dans le classement.":"Score enregistré localement. Le classement local reste disponible.",
    $("saveScoreBtn").textContent="Score enregistré";$("saveScoreBtn").disabled=true;
    const again=document.createElement("button");again.className="back";again.style.marginLeft="8px";again.textContent="Rejouer";again.onclick=restartCurrent;$('saveScoreBtn').after(again);
  };
  await loadLeaderboard(game);
}
function applyTheme(){const mode=localStorage.getItem("pixelArcadeTheme")||"dark";document.documentElement.classList.toggle("light",mode==="light");const b=$("themeBtn");if(b)b.textContent=mode==="light"?"Mode sombre":"Mode clair";const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=mode==="light"?"#f3f5f8":"#070a12"}
function toggleTheme(){const next=document.documentElement.classList.contains("light")?"dark":"light";localStorage.setItem("pixelArcadeTheme",next);applyTheme()}
applyTheme();
let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;const b=$("installBtn");if(b)b.style.display="inline-block"});
async function installApp(){if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();try{await deferredInstallPrompt.userChoice}catch(e){}deferredInstallPrompt=null;const b=$("installBtn");if(b)b.style.display="none"}
if("serviceWorker" in navigator && location.protocol!=="file:"){navigator.serviceWorker.register("pixel-arcade-sw.js", {scope:"./"}).catch(()=>{});}
async function initSupa(){try{if(SUPABASE_ANON_KEY.startsWith("REMPLACE"))throw Error("Clé anon locale manquante");await api("scores?select=id&limit=1");supa=true;$("connection").textContent="Supabase local : actif";$("dot").style.background="var(--good)";if(currentGame)loadLeaderboard(currentGame)}catch(e){$("connection").textContent="Supabase local : non connecté";$("dot").style.background="var(--bad)";if(currentGame)loadLeaderboard(currentGame)}}
let currentGame=null;
function home(){
  clearGame();
  resetActiveScore();
  currentGame=null;finishShown=false;
  $("games").style.display="grid";
  $("toolbar").style.display="flex";
  $("back").style.display="none";
  $("replay").style.display="none";
  title("Choisis un jeu");
  $("leaderboard").style.display="none";
  box('<p class="muted">Choisis un jeu pour commencer.</p>');
  window.scrollTo({top:0,behavior:"smooth"});
}
function start(n){
  clearGame();
  resetActiveScore();
  finishShown=false;currentGame=n;
  $("games").style.display="none";$("toolbar").style.display="none";$("back").style.display="inline-block";$("replay").style.display="inline-block";
  const games={runner,memory,meteor,snake,breakout,flappy,reaction,quiz,clicker,pong,ttt,draw,tap,rps,lights,dots,math};
  if(typeof games[n]==="function") games[n]();
  const d=document.createElement("div");d.className="desc";d.innerHTML=`<strong>Description :</strong> ${esc(GAME_DESC[n]||"Jeu d’arcade local.")}`;$("game").prepend(d);

function rps(){title("Shifumi");box('<div class="center" style="text-align:center"><h2>Premier à 3 manches</h2><p>J1 : A Pierre • S Papier • D Ciseaux</p><p>J2 : J Pierre • K Papier • L Ciseaux</p><p id=rm class=muted>Faites vos choix...</p></div>');let a=null,b=null,wins=[0,0],map={a:"P",s:"S",d:"C",j:"P",k:"S",l:"C"};window.onkeydown=e=>{let k=e.key.toLowerCase();if(!map[k]||finishShown)return;if("asd".includes(k))a=map[k];else b=map[k];if(a&&b){let w=a===b?-1:((a==="P"&&b==="C")||(a==="S"&&b==="P")||(a==="C"&&b==="S")?0:1);if(w>=0)wins[w]++;let txt=w<0?"Égalité":`J${w+1} gagne la manche`;$("rm").textContent=`J1 ${a} • J2 ${b}  -  ${txt} · Score ${wins[0]}-${wins[1]}`;a=b=null;if(wins[0]>=3||wins[1]>=3)score("rps",Math.max(wins[0],wins[1])*100,2)}}}

/* 15 Lights */
function lights(){title("Light Race");box('<div class="center" style="text-align:center"><div class="versus"><div class=scorebox>J1<div id=l1 class=big>0</div>F</div><div class=scorebox>J2<div id=l2 class=big>0</div>J</div></div><p id=lm>La cible arrive...</p></div>');let s=[0,0],target=-1,locked=true,finished=false;function spawn(){if(finished)return;locked=false;target=Math.random()<.5?0:1;$("lm").textContent=target===0?"F !":"J !";timer(()=>{if(!locked){locked=true;spawn()}},1200)}window.onkeydown=e=>{if(finished||locked)return;let k=e.key.toLowerCase(),w=k==="f"?0:k==="j"?1:-1;if(w<0)return;if(w===target){locked=true;s[w]++;$("l"+(w+1)).textContent=s[w];if(s[w]>=7){finished=true;$("lm").textContent=(w?"J2":"J1")+" gagne !";score("lights",7,2)}else spawn()}};spawn()}

/* 16 Dots */
function dots(){title("Dot Duel");box('<div class="center" style="text-align:center"><h2>Capture les 25 cases</h2><p>J1 = A • J2 = L</p><div id="dd" style="display:grid;grid-template-columns:repeat(5,55px);gap:7px;justify-content:center"></div><p id="dt">J1 : 0 — J2 : 0</p></div>');let turn=0,s=[0,0],taken=0,done=false;for(let i=0;i<25;i++){let z=document.createElement("button");z.className="small";z.style.height="55px";z.textContent="•";z.onclick=()=>{if(done||z.dataset.used)return;z.dataset.used=1;z.style.background=turn?"#a36cff":"#7481ff";s[turn]++;taken++;turn=1-turn;$("dt").textContent=`J1 : ${s[0]} — J2 : ${s[1]}`;if(taken===25){done=true;let pts=Math.max(s[0],s[1])*40;score("dots",pts,2)}};$("dd").appendChild(z)}window.onkeydown=e=>{let k=e.key.toLowerCase();if(done)return;if((k==="a"&&turn===0)||(k==="l"&&turn===1)){let z=[...$("dd").children].find(q=>!q.dataset.used);if(z)z.click()}}}

/* 17 Math */
function math(){title("Math Duel");let s=[0,0],q=null,locked=false,answerBox=null;
function next(){
  let a=2+Math.floor(Math.random()*18),b=2+Math.floor(Math.random()*18);
  q={ans:a*b,text:`${a} × ${b} = ?`};locked=false;
  box(`<div class="center" style="text-align:center">
    <div class="versus"><div class="scorebox">J1<div class="big">${s[0]}</div>F</div><div class="scorebox">J2<div class="big">${s[1]}</div>J</div></div>
    <h2>${q.text}</h2><p class="muted">Chaque joueur appuie sur sa touche puis écrit sa réponse.</p>
    <input id="mathInput" inputmode="numeric" autocomplete="off" style="width:180px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#151b2d;color:#fff;font-size:22px;text-align:center" placeholder="Réponse">
    <div style="margin-top:10px"><button class="primary" id="mathJ1">J1 — F</button> <button class="primary" id="mathJ2">J2 — J</button></div>
    <p id="mathMsg" class="muted">Choisissez un joueur.</p></div>`);
  answerBox=$("mathInput");answerBox.focus();
  $("mathJ1").onclick=()=>answer(0);$("mathJ2").onclick=()=>answer(1);
}
function answer(player){
  if(locked||!q)return;
  let ans=Number(answerBox.value.trim());
  if(!Number.isFinite(ans)){ $("mathMsg").textContent="Écris un nombre."; answerBox.focus(); return; }
  locked=true;
  if(ans===q.ans){
    s[player]++;
    if(s[player]>=5){
      score("math",5,2);
      box(`<div style="text-align:center"><h2>J${player+1} gagne !</h2><p class="muted">5 points atteints.</p><button class="primary" onclick="restartCurrent()">Rejouer</button></div>`);
      q=null;return;
    }
  }
  next();
}
window.onkeydown=e=>{if(e.key==="Enter"&&!locked&&q)answer(0);};
next();}
$("toolbar").style.display="flex";$("replay").style.display="none";$("back").style.display="none";
initSupa();
</script>
</body>
</html>
