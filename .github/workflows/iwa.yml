name: Pixel Arcade — AWI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Web Bundle tools
        run: npm install --no-save wbn@0.0.9 wbn-sign@0.3.1

      - name: Prepare IWA files
        run: python3 iwa-build.py

      - name: Load signing key
        env:
          IWA_PRIVATE_KEY: ${{ secrets.IWA_PRIVATE_KEY }}
        run: |
          test -n "$IWA_PRIVATE_KEY" || { echo "Le secret IWA_PRIVATE_KEY est manquant."; exit 1; }
          printf '%s\n' "$IWA_PRIVATE_KEY" > iwa-private-key.pem
          chmod 600 iwa-private-key.pem

      - name: Build and sign the IWA
        env:
          IWA_PRIVATE_KEY_FILE: ${{ github.workspace }}/iwa-private-key.pem
          IWA_VERSION: 10.6.${{ github.run_number }}
        run: node iwa-sign.mjs iwa-dist signed.swbn

      - name: Prepare GitHub Pages site
        env:
          IWA_VERSION: 10.6.${{ github.run_number }}
        run: |
          rm -rf pages-site
          mkdir -p pages-site
          rsync -a --exclude='.git' --exclude='.github' --exclude='iwa-dist' --exclude='iwa-private-key.pem' --exclude='signed.swbn' --exclude='pages-site' ./ pages-site/
          mkdir -p "pages-site/iwa"
          cp signed.swbn "pages-site/iwa/pixel-arcade-${IWA_VERSION}.swbn"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('pages-site')
          version=os.environ['IWA_VERSION']
          manifest_path=root/'.well-known/manifest.webmanifest'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version']=version
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          updates={
            'versions':[{'version':version,'src':f'../iwa/pixel-arcade-{version}.swbn','channels':['default']}],
            'channels':{'default':{'name':'Stable'}}
          }
          (root/'.well-known/updates.json').write_text(json.dumps(updates,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm -f pages-site/iwa-keygen.html pages-site/iwa-build.py pages-site/iwa-sign.mjs
          rm -rf pages-site/iwa-dist
          rm -f iwa-private-key.pem

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
